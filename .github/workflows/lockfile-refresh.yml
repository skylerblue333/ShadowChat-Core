name: Temporary Lockfile Refresh

on:
  push:
    branches: [product/36-shadowchat-major-app-20260825]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: product/36-shadowchat-major-app-20260825

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: refresh lockfile for esbuild security baseline"
          git push origin HEAD:product/36-shadowchat-major-app-20260825
